<div id="boreo-r03-viewer">
  <h3>Bozza R03 · U diretta</h3>
  <div class="viz-row" aria-label="Viste del modello">
    <button type="button" class="btn" data-view="iso" aria-pressed="true">3D</button>
    <button type="button" class="btn" data-view="top" aria-pressed="false">Dall’alto</button>
    <button type="button" class="btn" data-view="side" aria-pressed="false">Di lato</button>
  </div>
  <div class="boreo-scene">
    <canvas class="cursor-interaction" aria-label="Modello 3D ruotabile: ponte interno curvo collegato a due bracci con fori laterali. Trascinare per ruotare.">Modello 3D della U, con ponte curvo e due fori laterali.</canvas>
  </div>
  <div class="viz-row text-small">
    <span><i class="boreo-swatch boreo-bridge"></i>Ponte interno: 1,2 mm</span>
    <span><i class="boreo-swatch boreo-arms"></i>Bracci e orecchie</span>
    <span>Trascina per ruotare</span>
  </div>
  <div class="text-small" aria-live="polite" data-status>Quote assunte · montaggio e resistenza da verificare</div>
</div>
<style>
#boreo-r03-viewer .boreo-scene {width:100%;height:390px;position:relative;}
#boreo-r03-viewer canvas {width:100%;height:100%;display:block;touch-action:pan-y;}
#boreo-r03-viewer .boreo-swatch {display:inline-block;width:10px;height:10px;margin-right:6px;}
#boreo-r03-viewer .boreo-bridge {background:var(--viz-series-1);}
#boreo-r03-viewer .boreo-arms {background:var(--viz-series-2);}
@media(max-width:450px){#boreo-r03-viewer .boreo-scene{height:285px;}}
</style>
<script>
(() => {
  const root=document.getElementById('boreo-r03-viewer');
  const data=__MESH_DATA__;
  const canvas=root.querySelector('canvas');
  const gl=canvas.getContext('webgl',{antialias:true,alpha:true,preserveDrawingBuffer:true});
  if(!gl){root.querySelector('[data-status]').textContent='Anteprima 3D non disponibile in questo browser. È disponibile anche l’anteprima PNG.';return;}
  const vs=`attribute vec3 pos;attribute vec3 normal;attribute vec3 tone;uniform mat3 view;uniform vec2 scale;uniform vec2 center;varying vec3 n;varying vec3 c;void main(){vec3 p=view*pos;gl_Position=vec4((p.xy-center)*scale,p.z/300.0,1.0);n=view*normal;c=tone;}`;
  const fs=`precision mediump float;varying vec3 n;varying vec3 c;void main(){vec3 norm=normalize(n);if(!gl_FrontFacing)norm=-norm;float light=.55+.45*max(dot(norm,normalize(vec3(-.3,.5,-1.0))),0.0);gl_FragColor=vec4(c*light,1.0);}`;
  function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
  const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);
  const center=data.bounds[0].map((v,i)=>(v+data.bounds[1][i])/2);
  const positions=data.vertices.map(v=>v.map((q,i)=>q-center[i]));
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  for(const [name,offset] of [['pos',0],['normal',12],['tone',24]]){const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,offset);}
  const uView=gl.getUniformLocation(program,'view'),uScale=gl.getUniformLocation(program,'scale'),uCenter=gl.getUniformLocation(program,'center');
  let yaw=-.6,elev=.55,viewName='iso';
  function restore(state){const p=state?.privateContent;if(Number.isFinite(p?.yaw)&&Number.isFinite(p?.elev)){yaw=p.yaw;elev=p.elev;viewName=p.view||'free';}}
  restore(window.openai?.widgetState);
  function save(){window.openai?.setWidgetState?.({modelContent:{revisione:'R03',quote:'assunte',vista:viewName},privateContent:{yaw,elev,view:viewName}})?.catch(()=>{});}
  function color(variable){const s=document.createElement('span');s.style.color=`var(${variable})`;root.appendChild(s);const c=getComputedStyle(s).color;s.remove();const vals=c.match(/[\d.]+/g).map(Number);return vals.slice(0,3).map(v=>v/255);}
  function upload(){
    const colors=[color('--viz-series-2'),color('--viz-series-1')],verts=[];
    data.faces.forEach((f,i)=>{const [a,b,c]=f.map(j=>positions[j]);const u=b.map((v,k)=>v-a[k]),v=c.map((q,k)=>q-a[k]);const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const length=Math.hypot(...n);for(const p of[a,b,c])verts.push(...p,...n.map(q=>q/length),...colors[data.bridge[i]]);});
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
  }
  function draw(){
    const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);gl.viewport(0,0,canvas.width,canvas.height);
    const c=Math.cos(yaw),s=Math.sin(yaw),ce=Math.cos(elev),se=Math.sin(elev);
    const right=[c,s,0],up=[-s*se,c*se,ce],depth=[-s*ce,c*ce,-se];
    const dot=(a,b)=>a.reduce((acc,q,i)=>acc+q*b[i],0);
    const projected=positions.map(p=>[dot(right,p),dot(up,p)]);
    const xs=projected.map(p=>p[0]),ys=projected.map(p=>p[1]);
    const rw=Math.max(...xs)-Math.min(...xs),rh=Math.max(...ys)-Math.min(...ys);
    const px=Math.min((w-48)/rw,(h-45)/rh);
    gl.uniform2f(uCenter,(Math.max(...xs)+Math.min(...xs))/2,(Math.max(...ys)+Math.min(...ys))/2);
    gl.uniformMatrix3fv(uView,false,new Float32Array([right[0],up[0],depth[0],right[1],up[1],depth[1],right[2],up[2],depth[2]]));
    gl.uniform2f(uScale,2*px/w,2*px/h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,data.faces.length*3);
    root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===viewName)));
    canvas.dataset.view=viewName;
  }
  root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{viewName=b.dataset.view;if(viewName==='iso'){yaw=-.6;elev=.55;}if(viewName==='top'){yaw=0;elev=Math.PI/2;}if(viewName==='side'){yaw=Math.PI/2;elev=0;}draw();save();}));
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.008;elev=Math.max(-1.55,Math.min(1.55,elev+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};viewName='free';draw();});
  canvas.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});canvas.addEventListener('pointercancel',()=>{drag=null;});
  window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);upload();draw();});
  new ResizeObserver(draw).observe(canvas);new MutationObserver(()=>{upload();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{upload();draw();});
  upload();draw();
})();
</script>
