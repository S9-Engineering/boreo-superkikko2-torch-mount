<div id="sk2-aggancio-concetto">
  <div class="viz-row sk2-key" aria-label="Legenda">
    <span><span class="sk2-swatch sk2-new"></span>Parti da progettare</span>
    <span><span class="sk2-swatch sk2-old"></span>Staffa e lampada originali</span>
    <span class="text-small text-muted">Schema esploso, non in scala</span>
  </div>
  <svg class="sk2-drawing" role="img" aria-labelledby="sk2-title sk2-desc"></svg>
</div>
<style>
  #sk2-aggancio-concetto { width: 100%; }
  #sk2-aggancio-concetto .sk2-key { gap: 12px; justify-content: flex-start; }
  #sk2-aggancio-concetto .sk2-key > span { display: inline-flex; align-items: center; gap: 6px; }
  #sk2-aggancio-concetto .sk2-swatch { width: 12px; height: 12px; display: inline-block; }
  #sk2-aggancio-concetto .sk2-new { background: var(--viz-series-1); }
  #sk2-aggancio-concetto .sk2-old { background: var(--muted-foreground); }
  #sk2-aggancio-concetto .sk2-drawing { display: block; width: 100%; }
  #sk2-aggancio-concetto .sk2-drawing text { fill: var(--foreground); font-size: 12px; font-family: inherit; }
  #sk2-aggancio-concetto .new-part { fill: color-mix(in srgb, var(--viz-series-1) 24%, var(--background)); stroke: var(--viz-series-1); stroke-width: 2; }
  #sk2-aggancio-concetto .original-part { fill: var(--muted); stroke: var(--muted-foreground); stroke-width: 2; }
  #sk2-aggancio-concetto .shell { fill: color-mix(in srgb, var(--muted-foreground) 9%, var(--background)); stroke: var(--border); stroke-width: 1; }
  #sk2-aggancio-concetto .hole { fill: var(--background); stroke: var(--foreground); stroke-width: 1.5; }
  #sk2-aggancio-concetto .guide { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 4 4; }
  #sk2-aggancio-concetto .leader { stroke: var(--muted-foreground); stroke-width: 1; fill: none; }
  #sk2-aggancio-concetto .fin { stroke: var(--muted-foreground); stroke-width: 1; }
</style>
<script>
(() => {
  const root = document.getElementById('sk2-aggancio-concetto');
  const svg = root.querySelector('.sk2-drawing');
  const ns = 'http://www.w3.org/2000/svg';
  function draw() {
    const w = Math.max(280, root.getBoundingClientRect().width);
    const narrow = w < 580;
    const c = narrow ? w / 2 : w * 0.36;
    const dx = narrow ? Math.min(110, (w - 100) / 2) : Math.min(118, w * 0.16);
    const l = c - dx, r = c + dx;
    const halfU = Math.min(76, dx * 0.7);
    const h = 502;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('height', h);
    svg.replaceChildren();
    function el(tag, attrs, text) {
      const e = document.createElementNS(ns, tag);
      for (const [key, value] of Object.entries(attrs || {})) e.setAttribute(key, value);
      if (text) e.textContent = text;
      svg.append(e); return e;
    }
    el('title', {id:'sk2-title'}, 'Collegamento proposto per la Superkikko2');
    el('desc', {id:'sk2-desc'}, 'Schema simbolico: ponte interno con due bracci attraverso le aperture esistenti del casco, traversino esterno separato e staffa originale a U collegata nei suoi due punti centrali. I perni laterali tra staffa e lampada sono conservati. Quote, passaggi e smontabilità dei fissaggi restano da verificare.');
    function label(text, y, sourceX, sourceY) {
      if (narrow) {
        el('text', {x:c, y, 'text-anchor':'middle'}, text);
      } else {
        const tx = Math.max(r + 38, w * 0.59);
        el('path', {d:`M ${sourceX} ${sourceY} L ${tx - 12} ${sourceY} L ${tx - 12} ${y - 4}`, class:'leader'});
        el('text', {x:tx, y}, text);
      }
    }
    // Ponte interno e bracci: forma simbolica, senza quote di produzione.
    el('path', {d:`M ${l-15} 57 Q ${c} 30 ${r+15} 57 L ${r+15} 77 Q ${c} 55 ${l-15} 77 Z`, class:'new-part'});
    for (const x of [l,r]) {
      el('rect', {x:x-9,y:66,width:18,height:121,rx:5,class:'new-part'});
      el('circle', {cx:x,cy:174,r:4,class:'hole'});
    }
    label('Ponte interno + due bracci', narrow ? 22 : 54, r+16,57);
    // La fascia del casco è interrotta nelle due aperture.
    for (const [x,width] of [[l-38,22],[l+17,r-l-34],[r+17,22]]) {
      el('rect', {x,y:127,width,height:25,class:'shell'});
    }
    label('Aperture esistenti del casco', narrow ? 112 : 141, r+40,140);
    // Collegamento smontabile dei bracci al traversino.
    for (const x of [l,r]) el('line', {x1:x,y1:190,x2:x,y2:254,class:'guide'});
    el('rect', {x:l-19,y:256,width:r-l+38,height:23,rx:5,class:'new-part'});
    for (const x of [l,r]) el('circle', {cx:x,cy:267.5,r:4.5,class:'hole'});
    for (const x of [c-23,c+23]) el('circle', {cx:x,cy:267.5,r:4,class:'hole'});
    label('Traversino esterno rimovibile', narrow ? 236 : 259, r+19,266);
    // I due punti centrali collegano l'adattatore alla staffa originale.
    for (const x of [c-23,c+23]) el('line', {x1:x,y1:282,x2:x,y2:344,class:'guide'});
    el('path', {d:`M ${c-halfU} 432 L ${c-halfU} 345 L ${c+halfU} 345 L ${c+halfU} 432 L ${c+halfU-9} 432 L ${c+halfU-9} 356 L ${c-halfU+9} 356 L ${c-halfU+9} 432 Z`,class:'original-part'});
    for (const x of [c-23,c+23]) el('circle', {cx:x,cy:350.5,r:3.4,class:'hole'});
    label('Due punti di fissaggio della staffa', narrow ? 319 : 326, c+25,350);
    // Corpo lampada e perni esistenti, rappresentati schematicamente.
    el('rect', {x:c-halfU+14,y:378,width:2*halfU-28,height:67,rx:8,class:'original-part'});
    for (let y=385;y<443;y+=8) el('line', {x1:c-halfU+18,y1:y,x2:c+halfU-18,y2:y,class:'fin'});
    for (const x of [c-halfU+4.5,c+halfU-4.5]) el('circle', {cx:x,cy:413,r:6,class:'hole'});
    label('Staffa a U e perni originali', narrow ? 468 : 399, c+halfU+7,413);
    el('text', {x:c,y:493,'text-anchor':'middle'}, 'Superkikko2');
  }
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
