 const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);

 for(const[name,offset]of[['pos',0],['normal',12],['tone',24]]){const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,offset);}
 const uView=gl.getUniformLocation(program,'view'),uScale=gl.getUniformLocation(program,'scale'),uCenter=gl.getUniformLocation(program,'center');
 data.components.forEach(c=>{c.normals=c.faces.map(f=>{const[a,b,d]=f.map(j=>c.vertices[j]),u=b.map((v,k)=>v-a[k]),v=d.map((q,k)=>q-a[k]);const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],l=Math.hypot(...n);return n.map(q=>q/l);});});
 let mode='exploded',yaw=2.5,elev=.5,camera=0,count=0,visible=[];
 function restore(state){const p=state?.privateContent;if(p?.revision==='R04'){if(['exploded','assembled','support'].includes(p.mode))mode=p.mode;if(Number.isFinite(p.yaw))yaw=p.yaw;if(Number.isFinite(p.elev))elev=p.elev;}}
 restore(window.openai?.widgetState);
 function save(){window.openai?.setWidgetState?.({modelContent:{revisione:'R04',vista:mode,quote:'assunte'},privateContent:{revision:'R04',mode,yaw,elev}})?.catch(()=>{});}
 function color(variable){const s=document.createElement('span');s.style.color=`var(${variable})`;root.appendChild(s);const c=getComputedStyle(s).color;s.remove();const ctx=document.createElement('canvas').getContext('2d');ctx.fillStyle=c;ctx.fillRect(0,0,1,1);return Array.from(ctx.getImageData(0,0,1,1).data).slice(0,3).map(v=>v/255);}
 function upload(){
  const foreground=color('--foreground'),background=color('--background');
  const body=foreground.map((v,i)=>.65*v+.35*background[i]);
  const palette=[color('--viz-series-1'),color('--viz-series-2'),color('--muted-foreground'),body],verts=[];visible=[];count=0;
  data.components.forEach(c=>{if(mode==='support'&&c.role>=2)return;const shift=mode==='exploded'?c.exploded:[0,0,0];const ps=c.vertices.map(v=>v.map((q,k)=>q+shift[k]));visible.push(...ps);c.faces.forEach((f,i)=>{for(const j of f)verts.push(...ps[j],...c.normals[i],...palette[c.role]);});count+=c.faces.length*3;});

 function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h||!visible.length)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);gl.viewport(0,0,canvas.width,canvas.height);
  const c=Math.cos(yaw),s=Math.sin(yaw),ce=Math.cos(elev),se=Math.sin(elev),right=[c,s,0],up=[-s*se,c*se,ce],depth=[-s*ce,c*ce,-se],dot=(a,b)=>a.reduce((n,q,i)=>n+q*b[i],0);
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(const p of visible){const x=dot(p,right),y=dot(p,up);xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y);}const px=Math.min((w-42)/(xmax-xmin),(h-38)/(ymax-ymin));
  gl.uniformMatrix3fv(uView,false,new Float32Array([right[0],up[0],depth[0],right[1],up[1],depth[1],right[2],up[2],depth[2]]));gl.uniform2f(uCenter,(xmin+xmax)/2,(ymin+ymax)/2);gl.uniform2f(uScale,2*px/w,2*px/h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,count);
  root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(mode===b.dataset.mode)));canvas.dataset.mode=mode;canvas.dataset.vertices=count;
 }
 root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;upload();draw();save();}));
 root.querySelector('[data-camera]').addEventListener('click',()=>{camera=(camera+1)%3;[yaw,elev]=[[2.5,.5],[Math.PI,0],[0,Math.PI/2]][camera];draw();save();});
 let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.008;elev=Math.max(-1.55,Math.min(1.55,elev+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};draw();});canvas.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});canvas.addEventListener('pointercancel',()=>{drag=null;});
 new ResizeObserver(draw).observe(canvas);new MutationObserver(()=>{upload();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{upload();draw();});window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);upload();draw();});upload();draw();
})().catch(()=>{document.getElementById('boreo-r04-viewer').querySelector('[data-status]').textContent='Anteprima 3D non disponibile; consultare la vista PNG.';});
